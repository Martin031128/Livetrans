name: release

# 双平台独立发版：版本号互不相通，Release 标题与产物名都带平台后缀。
#
# 触发方式：
#   - 推送标签：v1.2.3-linux → 只构建/发布 Linux；v1.2.3-win → 只构建/发布 Windows
#   - 手动 workflow_dispatch：两平台各用各的 __version__ 试打包（只出 artifact，不发 Release）
#
# 版本号来源：tag 触发时去掉平台后缀（v1.0.0-win → 1.0.0）；
# 手动触发时各读各的 livetrans/__init__.py（platforms/linux 与 platforms/windows 独立）。

on:
  push:
    tags: ["v*-linux", "v*-win"]
  workflow_dispatch:

permissions:
  contents: write

# ---------------- Linux（*-linux） ----------------
jobs:
  build-linux:
    if: github.event_name == 'workflow_dispatch' || endsWith(github.ref_name, '-linux')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 解析版本号（tag 去掉 -linux 后缀；否则读 linux 版 __version__）
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME%-linux}" >> "$GITHUB_ENV"
          else
            V=$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' platforms/linux/livetrans/__init__.py | head -1)
            echo "VERSION=${V:-0.0.0-dev}" >> "$GITHUB_ENV"
          fi
          echo "本次将打包版本：$(grep ^VERSION= "$GITHUB_ENV" | tail -1)"

      - name: 打包环境
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rsync libportaudio2 libsndfile1

      - name: Python 依赖（下载模型需要）
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r platforms/linux/requirements.txt

      - name: ① 普通包（不含模型，首次启动自动下载）
        working-directory: platforms/linux
        run: |
          bash packaging/build_deb.sh
          mv dist/livetrans_${VERSION}_all.deb dist/livetrans_${VERSION}_all_online.deb

      - name: ② 完全离线包（先下识别/声纹模型，再打进去）
        working-directory: platforms/linux
        run: |
          python3 -c "from livetrans.asr import preload_model; preload_model()"
          python3 -c "from livetrans.speaker import ensure_speaker_model; ensure_speaker_model(log=print)"
          bash packaging/build_deb.sh --offline
          mv dist/livetrans_${VERSION}_all.deb dist/livetrans_${VERSION}_all_offline.deb

      - name: 校验和
        working-directory: platforms/linux
        run: |
          cd dist && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS

      - name: 产物（Actions Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: livetrans-linux
          path: |
            platforms/linux/dist/*.deb
            platforms/linux/dist/SHA256SUMS

  release-linux:
    if: github.event_name == 'push' && endsWith(github.ref_name, '-linux')
    needs: build-linux
    runs-on: ubuntu-22.04
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 解析版本号
        run: echo "VERSION=${GITHUB_REF_NAME%-linux}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: livetrans-linux
          path: release

      - name: 创建/更新 Linux Release（仅 Linux 产物）
        run: |
          ls -lh release
          cat > /tmp/notes.md <<EOF
          ## LiveTrans Linux ${VERSION}

          ### 安装（Debian / Ubuntu）
          \`\`\`bash
          # 普通包：装完即用，首次启动联网自动下载识别模型
          sudo dpkg -i livetrans_${VERSION}_all_online.deb
          # 完全离线包：模型已内置，装完无需联网（体积约 200MB+）
          sudo dpkg -i livetrans_${VERSION}_all_offline.deb
          \`\`\`
          依赖缺失时执行 \`sudo apt -f install\`；pip 侧依赖：
          \`/usr/share/doc/livetrans/install-python-deps.sh\`

          图形化安装向导：应用菜单里的「LiveTrans 安装向导」
          详细说明见 [README](https://github.com/Martin031128/Livetrans#安装)。
          EOF
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 更新安装包与说明"
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "LiveTrans Linux ${VERSION}" --notes-file /tmp/notes.md
          else
            echo "Release $TAG 不存在 → 新建"
            gh release create "$TAG" release/* \
              --title "LiveTrans Linux ${VERSION}" --notes-file /tmp/notes.md
          fi

# ---------------- Windows（*-win） ----------------
  build-windows:
    if: github.event_name == 'workflow_dispatch' || endsWith(github.ref_name, '-win')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 解析版本号（tag 去掉 -win 后缀；否则读 windows 版 __version__）
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $v = "${{ github.ref_name }}".TrimEnd("win").TrimEnd("-")
          } else {
            $m = Select-String -Path "platforms/windows/livetrans/__init__.py" -Pattern '^__version__ = "(.*)"'
            $v = if ($m) { $m.Matches[0].Groups[1].Value } else { "0.0.0-dev" }
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "本次将打包版本：$v"

      - name: Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r platforms/windows/requirements.txt pyinstaller

      - name: 构建便携版（PyInstaller one-dir）
        working-directory: platforms/windows
        shell: pwsh
        run: |
          python packaging/build_windows.py --portable > build_out.txt 2>&1
          $code = $LASTEXITCODE
          Get-Content build_out.txt -Tail 40
          if ($code -ne 0) {
            # 失败详情写入 Job Summary（公开可见，便于远程诊断）
            $tail = Get-Content build_out.txt -Tail 100
            ($tail -join "`n") |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit $code
          }

      - name: 打包便携 zip 与校验和
        working-directory: platforms/windows
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/LiveTrans/*" `
            -DestinationPath "dist/LiveTrans-$env:VERSION-win-portable.zip" -Force
          Get-FileHash "dist/LiveTrans-$env:VERSION-win-portable.zip" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  LiveTrans-$env:VERSION-win-portable.zip" } |
            Out-File -FilePath "dist/SHA256SUMS-windows.txt" -Encoding ascii

      - name: 构建 Inno Setup 安装器（可选产物，失败不阻断 zip 发版）
        working-directory: platforms/windows
        shell: pwsh
        continue-on-error: true
        run: |
          choco install innosetup -y --no-progress
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "找不到 ISCC.exe" }
          & $iscc /DVERSION=$env:VERSION packaging/installer.iss

      - name: 产物（Actions Artifacts）
        uses: actions/upload-artifact@v4
        with:
          name: livetrans-windows
          path: |
            platforms/windows/dist/*.zip
            platforms/windows/dist/*.exe
            platforms/windows/dist/SHA256SUMS-windows.txt

  release-windows:
    if: github.event_name == 'push' && endsWith(github.ref_name, '-win')
    needs: build-windows
    runs-on: ubuntu-22.04
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 解析版本号
        run: echo "VERSION=${GITHUB_REF_NAME%-win}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          name: livetrans-windows
          path: release

      - name: 创建/更新 Windows Release（仅 Windows 产物）
        run: |
          ls -lh release
          cat > /tmp/notes.md <<EOF
          ## LiveTrans Windows ${VERSION}

          ### 安装
          \`\`\`powershell
          # 安装器：双击 LiveTrans-${VERSION}-win-setup.exe，按向导安装（推荐）
          # 便携版：解压后直接运行 LiveTrans.exe
          Expand-Archive LiveTrans-${VERSION}-win-portable.zip -DestinationPath LiveTrans
          .\LiveTrans\LiveTrans.exe
          \`\`\`
          安装器装到 Program Files；config/keys/识别模型等用户数据自动放
          %LOCALAPPDATA%\\LiveTrans，卸载重装不丢失。
          识别模型已随包内置（离线可用）；翻译需在控制台填入 API key。
          详细说明见 [README](https://github.com/Martin031128/Livetrans#安装)。
          EOF
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在 → 更新安装包与说明"
            gh release upload "$TAG" release/* --clobber
            gh release edit "$TAG" --title "LiveTrans Windows ${VERSION}" --notes-file /tmp/notes.md
          else
            echo "Release $TAG 不存在 → 新建"
            gh release create "$TAG" release/* \
              --title "LiveTrans Windows ${VERSION}" --notes-file /tmp/notes.md
          fi
