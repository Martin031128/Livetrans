name: test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:            # 也能在 Actions 页面手动点 "Run workflow"

jobs:
  # Linux 版：自检 + 全部专项测试（xvfb 提供虚拟显示）
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: 系统依赖（Tk / GTK3 / 音频工具 / 中文字体 / 虚拟显示）
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk python3-gi gir1.2-gtk-3.0 \
            gir1.2-pango-1.0 python3-cairo pulseaudio-utils fonts-noto-cjk xvfb \
            libportaudio2 libsndfile1
      - name: Python 依赖
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r platforms/linux/requirements.txt
      - name: 自检 + 全部专项测试（xvfb 提供虚拟显示）
        working-directory: platforms/linux
        run: xvfb-run -a bash tests/run.sh

  # Windows 版：自检 + 专项测试（GUI 类用例依赖虚拟显示，暂由测试内部自行跳过）
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python 依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r platforms/windows/requirements.txt
      - name: 自检 + 全部专项测试
        working-directory: platforms/windows
        shell: pwsh
        run: |
          python tests/run.py > ci_out.txt 2>&1
          $code = $LASTEXITCODE
          Get-Content ci_out.txt
          if ($code -ne 0) {
            # 失败详情写入 Job Summary（公开可见，便于远程诊断）
            $tail = Get-Content ci_out.txt -Tail 60
            ($tail -join "`n") |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit $code
          }
