name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:            # 手动试打包（不打 tag 也能跑）

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - name: 解析版本号（tag v1.2.3 → 1.2.3；手动触发则读 livetrans/__init__.py）
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            V=$(sed -n 's/^__version__ = "\(.*\)".*/\1/p' prototype/livetrans/__init__.py | head -1)
            echo "VERSION=${V:-0.0.0-dev}" >> "$GITHUB_ENV"
          fi
          echo "本次将打包版本：$(grep ^VERSION= "$GITHUB_ENV" | tail -1)"

      - name: 打包环境
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rsync libportaudio2 libsndfile1

      - name: Python 依赖（下载模型需要）
        run: python3 -m pip install --upgrade pip && python3 -m pip install -r prototype/requirements.txt

      - name: ① 普通包（不含模型，首次启动自动下载）
        working-directory: prototype
        run: |
          bash packaging/build_deb.sh
          mv dist/livetrans_${VERSION}_all.deb dist/livetrans_${VERSION}_all_online.deb

      - name: ② 完全离线包（先下识别/声纹模型，再打进去）
        working-directory: prototype
        run: |
          python3 -c "from livetrans.asr import preload_model; preload_model()"
          python3 -c "from livetrans.speaker import ensure_speaker_model; ensure_speaker_model(log=print)"
          bash packaging/build_deb.sh --offline
          mv dist/livetrans_${VERSION}_all.deb dist/livetrans_${VERSION}_all_offline.deb

      - name: 校验和
        working-directory: prototype
        run: |
          cd dist && sha256sum *.deb > SHA256SUMS && cat SHA256SUMS

      - name: 手动触发时：包作为 Actions 产物（Artifacts）供下载
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: livetrans-${{ env.VERSION }}-deb
          path: |
            prototype/dist/*.deb
            prototype/dist/SHA256SUMS

      - name: 打 tag 时：创建 Release 并附上安装包（用自带 gh CLI，无第三方依赖）
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: prototype
        run: |
          cat > /tmp/notes.md <<EOF
          ## 安装

          \`\`\`bash
          # 普通包：装完即用，首次启动联网自动下载识别模型
          sudo dpkg -i livetrans_${VERSION}_all_online.deb
          # 完全离线包：模型已内置，装完无需联网（体积约 200MB+）
          sudo dpkg -i livetrans_${VERSION}_all_offline.deb
          \`\`\`

          依赖缺失时执行 \`sudo apt -f install\`；pip 侧依赖：
          \`/usr/share/doc/livetrans/install-python-deps.sh\`

          图形化安装向导：应用菜单里的「LiveTrans 安装向导」，或终端执行 \`livetrans-installer\`

          详细说明见 [README](https://github.com/Martin031128/Livetrans#安装)。
          EOF
          # 同一个 tag 重新推过时 Release 已经存在（create 会直接报错），
          # 所以这里分两种情形：已存在就替换安装包 + 更新说明，不存在才创建。
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME 已存在 → 更新安装包与说明"
            gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS --clobber
            gh release edit "$GITHUB_REF_NAME" --title "LiveTrans $VERSION" --notes-file /tmp/notes.md
          else
            echo "Release $GITHUB_REF_NAME 不存在 → 新建"
            gh release create "$GITHUB_REF_NAME" dist/*.deb dist/SHA256SUMS \
              --title "LiveTrans $VERSION" --notes-file /tmp/notes.md
          fi
